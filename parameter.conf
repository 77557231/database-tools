# ================================================================================
# oscheckperf Configuration File
# ================================================================================
# This file contains all configurable parameters for oscheckperf
# Use with: ./oscheckperf -p parameter.conf
# Command line parameters override values in this file
# ================================================================================

# ================================================================================
# General parameters
# ================================================================================

# Unified test duration in seconds
# Default: 90
DURATION=90

# Output directory for test results
# Default: ./output
OUTPUT_DIR=./output

# SSH port for remote server connections
# Default: 22
SSH_PORT=22

# Execution mode for multi-server tests: parallel or serial
# parallel: run tests on all servers simultaneously
# serial: run tests on servers one by one
# Default: parallel
EXEC_MODE=parallel

# ================================================================================
# Test Module Switches
# ================================================================================
# Set to false to disable specific test modules
# Command line subcommands (cpu/mem/io/etc./all) must be explicitly specified
# Configuration file settings are used when no subcommand is specified via config file

# Include hardware information in performance report
# Default: true
REPORT_HARDWARE_INFO=true

# Enable CPU performance test
# Default: true
CPU_ENABLED=true

# Enable memory performance test
# Default: true
MEMORY_ENABLED=true

# Enable IO performance test
# Default: true
IO_ENABLED=true

# Enable network performance test
# Default: true
NETWORK_ENABLED=true

# Enable threads performance test
# Default: true
THREADS_ENABLED=true

# Enable mutex performance test
# Default: false
MUTEX_ENABLED=false

# ================================================================================
# CPU test parameters
# ================================================================================

# CPU test threads, 0=auto (uses all available CPUs)
# Default: 0
CPU_THREADS=0

# Max prime number for CPU test
# Default: 20000
CPU_MAX_PRIME=20000

# ================================================================================
# Memory test parameters
# ================================================================================

# Memory test threads, 0=auto
# Default: 0
MEMORY_THREADS=0

# Memory block size per operation
# Default: 8K
MEMORY_BLOCK_SIZE=8K

# Total memory size to test
# Special value: 0=auto (uses 60% of total system memory)
# Default: 0
MEMORY_TOTAL_SIZE=0

# Memory operation type: read, write
# Default: read write
MEMORY_OPER=read write

# ================================================================================
# IO test parameters
# ================================================================================
# IO test tool: sysbench or fio
# Default: fio
IO_TOOL=fio

# Total file size for IO test
# Default: 70% of available disk space (min 1G, max 100G)
# If not set, automatically calculated based on IO_PATH filesystem available space
# Supports units: G (gigabytes), M (megabytes), K (kilobytes)
# Example: IO_TOTAL_SIZE=15000M, IO_TOTAL_SIZE=10G
#IO_TOTAL_SIZE=

# IO test directory path
# Default: $HOME/oscheckperf/io_test
IO_PATH=

# --------------------------------------------------------------------------------
# sysbench-specific parameters
# --------------------------------------------------------------------------------

# sysbench IO test mode: sync, async
# Default: sync
SYSBENCH_IO_MODE=sync

# sysbench extra flags: direct, sync
# Default: direct
SYSBENCH_EXTRA_FLAGS=direct

# Number of sysbench threads
# Default: 4
SYSBENCH_THREADS=4

# Number of test files
# Default: 4
SYSBENCH_FILE_NUM=4

# Block size
# Default: 16K
SYSBENCH_BLOCK_SIZE=16K

# sysbench test profiles (for sysbench IO), space-separated
# Available: seqwr, seqrewr, seqrd, rndrd, rndwr, rndrw
#   - seqwr: Sequential write
#   - seqrewr: Sequential rewrite
#   - seqrd: Sequential read
#   - rndrd: Random read
#   - rndwr: Random write
#   - rndrw: Random read/write (default)
# Default: seqrd seqwr rndrd rndwr
SYSBENCH_PROFILES=seqrd seqwr rndrd rndwr

# sysbench IO test duration (uses DURATION if not set)
# Default: (empty - uses DURATION)
SYSBENCH_DURATION=

# --------------------------------------------------------------------------------
# fio-specific parameters
# --------------------------------------------------------------------------------

# fio test duration (uses DURATION if not set)
# Default: (empty - uses DURATION)
FIO_DURATION=

# fio test profiles, space-separated
# Available: read, write, randread, randwrite, rw, randrw, trim, randtrim, trimwrite
#   - read: Sequential read
#   - write: Sequential write
#   - randread: Random read
#   - randwrite: Random write
#   - rw: Sequential read/write (mixed)
#   - randrw: Random read/write (mixed) (default)
#   - trim: Sequential TRIM (SSD optimization)
#   - randtrim: Random TRIM (SSD optimization)
#   - trimwrite: Write with TRIM (SSD optimization)
# Default: read write randread randwrite
FIO_PROFILES=read write randread randwrite

# fio block size(s), space-separated
# Supports multiple values that map to FIO_PROFILES by index
# Single value applies to all profiles
# Default: 128K 128K 4K 4K (matches default FIO_PROFILES: read/write/randread/randwrite)
# Reference: Aliyun ECS block storage performance test specification
FIO_BS=128K 128K 4K 4K

# I/O depth(s), space-separated
# Supports multiple values that map to FIO_PROFILES by index
# Single value applies to all profiles
# Default: 128 128 32 32 (matches default FIO_PROFILES: read/write/randread/randwrite)
# Reference: Aliyun ECS block storage performance test specification
FIO_IODEPTH=128 128 32 32

# Number of jobs(s), space-separated
# Supports multiple values that map to FIO_PROFILES by index
# Single value applies to all profiles
# Set to 0 to auto-detect CPU core count
# Default: 1 1 4 4 (matches default FIO_PROFILES: read/write/randread/randwrite)
# Reference: Aliyun ECS block storage performance test specification
FIO_NUMJOBS=1 1 4 4

# Direct I/O mode (1=bypass OS cache)
# Default: 1
FIO_DIRECT=1

# Number of test files (simulates multi-datafile scenario)
# Default: 1
FIO_NRFILES=1

# I/O engine: libaio, sync, posixaio
# Default: libaio
FIO_IOENGINE=libaio

# ================================================================================
# Threads test parameters
# ================================================================================

# Number of threads for threads test, 0=auto (cpu_cores*4)
# Default: 0
THREADS_NUM=0

# Number of yields per request
# Default: 1000
THREADS_YIELDS=1000

# Number of mutex locks
# Default: 8
THREADS_LOCKS=8

# ================================================================================
# Mutex test parameters
# ================================================================================

# Number of threads for mutex test, 0=auto
# Default: 0
MUTEX_THREADS=0

# Number of mutexes
# Default: 1024
MUTEX_NUM=1024

# ================================================================================
# Network test parameters
# ================================================================================

# Network test tool
# Default: iperf3
NETWORK_TOOL=iperf3

# Network test mode: serial or matrix
# serial: uses first host as server, supports local/remote server
# matrix: full matrix cross-testing between all server pairs
# Default: matrix
NETWORK_MODE=matrix

# Network test protocol: tcp or udp
# Default: tcp
NETWORK_PROTOCOL=tcp

# Network test port
# Format: single port (25201) or port range (25201-25210)
# Single port mode: ports will increment without limit (25201, 25202, 25203, ...)
# Port range mode: ports will cycle within the range (25201-25210, then back to 25201)
# Default: 25201
NETWORK_PORT=25201

# Network parallel connections
# Default: 4
NETWORK_PARALLEL=4

# Network test duration in seconds (uses DURATION if not set)
# Default: (empty - uses DURATION)
NETWORK_DURATION=

# ================================================================================
# Installation parameters
# ================================================================================

# Installation target for -i option: sysbench, sshpass, fio, iperf3, numactl, ethtool, jq, oscheckperf, all
# Default: (empty)
INSTALL_TARGET=

# Server list file path
# Default: (empty)
SERVERS_FILE=

# ================================================================================
# Debug and dry-run parameters
# ================================================================================

# Log level: INFO, WARN, ERROR
# INFO: Show all logs including debug and informational messages (default)
# WARN: Show only warnings and errors
# ERROR: Show only errors
# Default: INFO
LOG_LEVEL=INFO

# Dry run mode (show commands without execution)
# Default: false
DRY_RUN=false

# Skip pre-test checks
# Default: false
NO_CHECKS=false

# ================================================================================
# End of configuration file
# ================================================================================
